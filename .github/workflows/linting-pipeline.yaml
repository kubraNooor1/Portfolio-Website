name: linting-workflow

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Stylelint
        run: npm install stylelint --save-dev

      - name: Lint CSS files
        run: npx stylelint "**/*.css"
